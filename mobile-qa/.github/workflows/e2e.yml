name: Mobile E2E Quality Gate (Android)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android-e2e:
    name: Appium + WebdriverIO E2E (KVM Headless Emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Project Dependencies & Appium 2.x Driver
        run: |
          npm ci
          npx appium driver install uiautomator2 || true

      - name: Start Appium Server in Background
        run: |
          nohup npx appium --base-path / --log-no-colors > appium.log 2>&1 &
          sleep 5

      - name: Run Android Emulator & Execute WebdriverIO E2E Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            npm test

      - name: Upload JUnit XML & Execution Logs Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-test-reports
          path: |
            reports/**
            appium.log
          retention-days: 14
